services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sensei-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/.chroma
      - db_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sensei-frontend
    ports:
      - "3050:8080"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped


volumes:
  chroma_data:
  db_data:
